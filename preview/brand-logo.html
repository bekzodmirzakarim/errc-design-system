<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-ui);background:var(--surface-inverse);padding:0;box-sizing:border-box}
  .logo{display:flex;gap:36px;align-items:center;padding:26px}
  .swatch{display:flex;gap:0}
  .swatch span{width:30px;height:30px}
</style></head>
<body>
  <div class="logo">
    <img src="../assets/logo.svg" alt="ЕРРЦ" style="height:56px;filter:brightness(0) invert(1);opacity:.0;position:absolute;left:-9999px">
    <!-- show light version directly -->
    <svg width="240" height="64" viewBox="0 0 240 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="4" width="56" height="56" rx="11" fill="#1d6fd8"/>
      <path d="M9 36 H20 L25 22 L32 46 L37 32 H47" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="47" cy="32" r="3.4" fill="#bcd6f7"/>
      <text x="72" y="34" font-family="Inter, sans-serif" font-size="26" font-weight="700" letter-spacing="0.04em" fill="#ffffff">ЕРРЦ</text>
      <text x="72" y="52" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.14em" fill="#9bb6d8">РИДИНГ-ЦЕНТР</text>
    </svg>
    <img src="../assets/logo.svg" alt="ЕРРЦ on light" style="height:56px;background:#fff;padding:8px 14px;border-radius:10px">
  </div>
</body></html>

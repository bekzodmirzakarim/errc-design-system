<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-ui);background:var(--surface-0);padding:18px 20px;box-sizing:border-box}
  .row{display:flex;gap:10px}
  .sw{flex:1;border-radius:var(--r-sm);height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;box-sizing:border-box;border:1px solid rgba(10,45,94,.10)}
  .hex{font-family:var(--font-mono);font-size:11px;font-weight:500}
  .nm{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.9}
  .lt{color:#fff}.dk{color:var(--ink-900)}
  .cap{font-size:11px;color:var(--ink-400);margin:0 0 12px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
</style></head>
<body>
  <p class="cap">Neutrals — cool slate &amp; surfaces</p>
  <div class="row">
    <div class="sw lt" style="background:#0f1b2d"><span class="nm">ink 900</span><span class="hex">#0F1B2D</span></div>
    <div class="sw lt" style="background:#5a6b80"><span class="nm">ink 500</span><span class="hex">#5A6B80</span></div>
    <div class="sw dk" style="background:#c9d4e0"><span class="nm">line 300</span><span class="hex">#C9D4E0</span></div>
    <div class="sw dk" style="background:#eef3f9"><span class="nm">surface 2</span><span class="hex">#EEF3F9</span></div>
    <div class="sw dk" style="background:#f6f9fc"><span class="nm">surface 1</span><span class="hex">#F6F9FC</span></div>
    <div class="sw dk" style="background:#ffffff"><span class="nm">surface 0</span><span class="hex">#FFFFFF</span></div>
  </div>
</body></html>

<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-ui);background:var(--surface-0);padding:18px 20px;box-sizing:border-box}
  .row{display:flex;gap:10px}
  .sw{flex:1;border-radius:var(--r-sm);height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;box-sizing:border-box;border:1px solid rgba(10,45,94,.08)}
  .hex{font-family:var(--font-mono);font-size:11px;font-weight:500}
  .nm{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.9}
  .lt{color:#fff}.dk{color:var(--ink-900)}
  .cap{font-size:11px;color:var(--ink-400);margin:0 0 12px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
</style></head>
<body>
  <p class="cap">Accent — interactive blue</p>
  <div class="row">
    <div class="sw lt" style="background:#1d6fd8"><span class="nm">500 · accent</span><span class="hex">#1D6FD8</span></div>
    <div class="sw lt" style="background:#4a8ee5"><span class="nm">400</span><span class="hex">#4A8EE5</span></div>
    <div class="sw dk" style="background:#8fbaf0"><span class="nm">300</span><span class="hex">#8FBAF0</span></div>
    <div class="sw dk" style="background:#dbeafe"><span class="nm">100</span><span class="hex">#DBEAFE</span></div>
    <div class="sw dk" style="background:#eff5fd"><span class="nm">50</span><span class="hex">#EFF5FD</span></div>
  </div>
</body></html>

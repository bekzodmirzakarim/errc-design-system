<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-ui);background:var(--surface-0);padding:18px 20px;box-sizing:border-box}
  .row{display:flex;gap:10px}
  .st{flex:1;border-radius:var(--r-md);border:1px solid var(--line-200);overflow:hidden}
  .bar{height:8px}
  .bd{padding:9px 10px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:var(--r-pill)}
  .dot{width:8px;height:8px;border-radius:50%}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--ink-400);margin-top:7px;display:block}
  .cap{font-size:11px;color:var(--ink-400);margin:0 0 12px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
</style></head>
<body>
  <p class="cap">Patient status — clinical states</p>
  <div class="row">
    <div class="st"><div class="bar" style="background:var(--st-critical)"></div><div class="bd"><span class="chip" style="background:var(--st-critical-bg);color:var(--st-critical-tx)"><span class="dot" style="background:var(--st-critical)"></span>Критический</span><span class="hex">#7C3AED</span></div></div>
    <div class="st"><div class="bar" style="background:var(--st-waiting)"></div><div class="bd"><span class="chip" style="background:var(--st-waiting-bg);color:var(--st-waiting-tx)"><span class="dot" style="background:var(--st-waiting)"></span>Ожидание</span><span class="hex">#E0A008</span></div></div>
    <div class="st"><div class="bar" style="background:var(--st-scanning)"></div><div class="bd"><span class="chip" style="background:var(--st-scanning-bg);color:var(--st-scanning-tx)"><span class="dot" style="background:var(--st-scanning)"></span>Сканирование</span><span class="hex">#1D6FD8</span></div></div>
    <div class="st"><div class="bar" style="background:var(--st-inwork)"></div><div class="bd"><span class="chip" style="background:var(--st-inwork-bg);color:var(--st-inwork-tx)"><span class="dot" style="background:var(--st-inwork)"></span>В работе</span><span class="hex">#64748B</span></div></div>
    <div class="st"><div class="bar" style="background:var(--st-ready)"></div><div class="bd"><span class="chip" style="background:var(--st-ready-bg);color:var(--st-ready-tx)"><span class="dot" style="background:var(--st-ready)"></span>Готово</span><span class="hex">#16A34A</span></div></div>
  </div>
</body></html>

<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-ui);background:var(--surface-0);padding:16px 22px;box-sizing:border-box}
  .r{display:flex;align-items:baseline;gap:14px;padding:6px 0;border-bottom:1px solid var(--line-100)}
  .r:last-child{border:0}
  .meta{font-family:var(--font-mono);font-size:10px;color:var(--ink-400);width:110px;flex:none}
</style></head>
<body>
  <div class="r"><span class="meta">14 / 400</span><span class="ds-body">Пациент доставлен бригадой СМП с подозрением на ОНМК по ишемическому типу.</span></div>
  <div class="r"><span class="meta">13 / 400</span><span class="ds-sm">Время от появления симптомов — в пределах терапевтического окна.</span></div>
  <div class="r"><span class="meta">12 / 600</span><span class="ds-label">Отделение неотложной помощи</span></div>
  <div class="r"><span class="meta">11 / 400</span><span class="ds-caption">Обновлено 30 секунд назад · автообновление включено</span></div>
</body></html>

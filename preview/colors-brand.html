<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-ui);background:var(--surface-0);padding:18px 20px;box-sizing:border-box}
  .row{display:flex;gap:10px}
  .sw{flex:1;border-radius:var(--r-sm);height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;box-sizing:border-box;border:1px solid rgba(255,255,255,.18)}
  .hex{font-family:var(--font-mono);font-size:11px;font-weight:500}
  .nm{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.85}
  .lt{color:#fff}.dk{color:var(--ink-900)}
  .cap{font-size:11px;color:var(--ink-400);margin:0 0 12px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
</style></head>
<body>
  <p class="cap">Brand core — corporate navy</p>
  <div class="row">
    <div class="sw lt" style="background:#06203f"><span class="nm">900</span><span class="hex">#06203F</span></div>
    <div class="sw lt" style="background:#0a2d5e"><span class="nm">800 · primary</span><span class="hex">#0A2D5E</span></div>
    <div class="sw lt" style="background:#0f3d7a"><span class="nm">700</span><span class="hex">#0F3D7A</span></div>
    <div class="sw lt" style="background:#14529e"><span class="nm">600</span><span class="hex">#14529E</span></div>
  </div>
</body></html>

<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-ui);background:var(--surface-0);padding:18px 22px;box-sizing:border-box}
  .row{display:flex;gap:18px;align-items:flex-end}
  .b{display:flex;flex-direction:column;align-items:center;gap:7px}
  .box{background:var(--brand-500);border-radius:2px}
  .v{font-family:var(--font-mono);font-size:11px;color:var(--ink-500)}
  .cap{font-size:11px;color:var(--ink-400);margin:0 0 14px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
</style></head>
<body>
  <p class="cap">Spacing scale · 4px base</p>
  <div class="row">
    <div class="b"><div class="box" style="width:4px;height:4px"></div><span class="v">4</span></div>
    <div class="b"><div class="box" style="width:8px;height:8px"></div><span class="v">8</span></div>
    <div class="b"><div class="box" style="width:12px;height:12px"></div><span class="v">12</span></div>
    <div class="b"><div class="box" style="width:16px;height:16px"></div><span class="v">16</span></div>
    <div class="b"><div class="box" style="width:20px;height:20px"></div><span class="v">20</span></div>
    <div class="b"><div class="box" style="width:24px;height:24px"></div><span class="v">24</span></div>
    <div class="b"><div class="box" style="width:32px;height:32px"></div><span class="v">32</span></div>
    <div class="b"><div class="box" style="width:40px;height:40px"></div><span class="v">40</span></div>
    <div class="b"><div class="box" style="width:48px;height:48px"></div><span class="v">48</span></div>
  </div>
</body></html>
